<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>局域网快传</title>
<style>
  :root{
    --bg:#f5f6fa;
    --card:#ffffff;
    --ink:#111827;
    --muted:#6b7280;
    --line:#e6e8ef;
    --accent:#4f46e5;
    --accent-soft:#eef0ff;
    --danger:#e11d48;
    --radius:18px;
    --shadow:0 1px 2px rgba(17,24,39,.04),0 8px 24px rgba(17,24,39,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e1016;
      --card:#171a22;
      --ink:#f3f4f6;
      --muted:#9ca3af;
      --line:#262a35;
      --accent:#818cf8;
      --accent-soft:#1e2233;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
    .drop{background:linear-gradient(180deg,#1a1e28,#151820)!important}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -200px, var(--accent-soft), transparent 70%), var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
    font-size:15px;
    line-height:1.5;
    min-height:100vh;
    padding:0 16px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:720px;margin:0 auto}
  header{padding:34px 4px 18px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{
    width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;flex:none;
    box-shadow:0 6px 16px rgba(99,102,241,.35);
  }
  h1{font-size:21px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13.5px;margin:6px 0 0}
  .urlchip{
    margin-top:14px;display:flex;align-items:center;gap:8px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;box-shadow:var(--shadow);
  }
  .urlchip code{
    flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:9px;padding:6px 11px;font-size:12.5px;cursor:pointer;
    font-family:inherit;transition:.15s;flex:none;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:active{transform:scale(.97)}

  .qr-wrap{margin-top:12px}
  .qr-box{
    margin-top:12px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px;text-align:center;box-shadow:var(--shadow);
    animation:pop .2s ease-out;
  }
  @keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .qr-box img{width:220px;height:220px;display:block;margin:0 auto;background:#fff;border-radius:10px}
  .qr-box p{margin:10px 0 0;color:var(--muted);font-size:12.5px}
  .hidden{display:none}

  .drop{
    margin-top:18px;position:relative;border-radius:var(--radius);
    background:linear-gradient(180deg,#ffffff,#fafbff);
    border:1.5px dashed #c7cbe0;
    padding:30px 20px;text-align:center;cursor:pointer;transition:.18s;
    box-shadow:var(--shadow);
  }
  .drop:hover,.drop.over{
    border-color:var(--accent);background:var(--accent-soft);
    transform:translateY(-1px);
  }
  .drop .icon{
    width:48px;height:48px;margin:0 auto 12px;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
    box-shadow:0 8px 18px rgba(99,102,241,.28);
  }
  .drop strong{font-size:15.5px}
  .drop p{margin:6px 0 0;color:var(--muted);font-size:13px}
  .drop .hint{font-size:12.5px;margin-top:2px;opacity:.85}

  .queue{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
  .q-item{
    background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:10px 13px;box-shadow:var(--shadow);animation:pop .18s ease-out;
  }
  .q-meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:7px}
  .q-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .q-status{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
  .bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#6366f1,#8b5cf6);transition:width .15s}
  .q-item.done .bar i{background:#10b981}
  .q-item.err .bar i{background:var(--danger)}

  .files{margin-top:26px}
  .files-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 10px}
  h2{font-size:15px;margin:0;letter-spacing:-.01em}
  #count{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
  #list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px}
  .f-item{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border:1px solid var(--line);
    border-radius:13px;padding:11px 13px;box-shadow:var(--shadow);
  }
  .f-ico{
    width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent);
  }
  .f-main{min-width:0;flex:1}
  .f-name{font-size:13.8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;color:inherit;text-decoration:none}
  .f-name:hover{color:var(--accent)}
  .f-meta{color:var(--muted);font-size:11.8px;margin-top:1px;font-variant-numeric:tabular-nums}
  .f-actions{display:flex;gap:6px;flex:none}
  .icon-btn{
    width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--muted);
    text-decoration:none;transition:.15s;
  }
  .icon-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .icon-btn.del:hover{color:var(--danger);border-color:var(--danger);background:rgba(225,29,72,.08)}
  .empty{
    text-align:center;color:var(--muted);font-size:13px;
    padding:26px 10px;border:1px dashed var(--line);border-radius:13px;
  }
  .chat{
    margin-top:26px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
  }
  .chat-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 15px;border-bottom:1px solid var(--line);
  }
  .chat-chip{
    font-size:12px;color:var(--accent);background:var(--accent-soft);
    padding:3px 9px;border-radius:99px;font-variant-numeric:tabular-nums;
  }
  .chat-msgs{
    height:330px;overflow-y:auto;padding:14px 14px 6px;
    display:flex;flex-direction:column;scroll-behavior:smooth;
    overscroll-behavior:contain;
  }
  .chat-empty{
    margin:auto;color:var(--muted);font-size:13px;text-align:center;
  }
  .msg{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:11px;max-width:100%}
  .msg .who{font-size:11.5px;color:var(--muted);margin:0 0 3px 4px}
  .msg .bubble{
    background:var(--accent-soft);color:var(--ink);
    padding:8px 12px;border-radius:14px 14px 14px 4px;
    max-width:82%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.8px;
  }
  .msg.me{align-items:flex-end}
  .msg.me .who{margin:0 4px 3px 0}
  .msg.me .bubble{
    background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
    border-radius:14px 14px 4px 14px;
  }
  .chat-form{display:flex;gap:8px;padding:11px 12px;border-top:1px solid var(--line)}
  .chat-input{
    flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);
    border-radius:11px;padding:9px 12px;font-family:inherit;font-size:14px;outline:none;transition:.15s;
  }
  .chat-input:focus{border-color:var(--accent);background:var(--card)}
  .send{
    border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
    border-radius:11px;padding:0 18px;font-family:inherit;font-size:13.5px;
    cursor:pointer;flex:none;transition:.15s;
  }
  .send:active{transform:scale(.97)}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);
    background:#111827;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;
    opacity:0;pointer-events:none;transition:.2s;z-index:9;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:420px){
    h1{font-size:19px}
    .drop{padding:26px 16px}
    .f-item{padding:10px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17V7m0 0L3.5 10.5M7 7l3.5 3.5"/><path d="M17 7v10m0 0 3.5-3.5M17 17l-3.5-3.5"/>
        </svg>
      </div>
      <div>
        <h1>局域网快传</h1>
        <p class="sub">同一 Wi-Fi 下，手机和平板电脑都能上传、下载</p>
      </div>
    </div>
    <div class="urlchip">
      <code id="urlText"></code>
      <button class="btn" id="copyBtn">复制</button>
    </div>
    <div class="qr-wrap">
      <button class="btn" id="qrBtn">手机扫码打开</button>
      <div class="qr-box hidden" id="qrBox">
        <img id="qrImg" alt="二维码">
        <p>手机连同一个 Wi-Fi，扫码即可打开</p>
      </div>
    </div>
  </header>

  <section class="drop" id="drop">
    <input type="file" id="picker" multiple hidden>
    <div class="icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3"/>
      </svg>
    </div>
    <p><strong>点击选择文件</strong>，或把文件拖到这里</p>
    <p class="hint">支持多选，大文件也可以</p>
  </section>

  <ul class="queue" id="queue"></ul>

  <section class="chat">
    <div class="chat-head">
      <h2>局域网聊天</h2>
      <span class="chat-chip" id="myName"></span>
    </div>
    <div class="chat-msgs" id="chatMsgs">
      <div class="chat-empty" id="chatEmpty">还没有人说话，打个招呼吧</div>
    </div>
    <form class="chat-form" id="chatForm">
      <input class="chat-input" id="chatInput" maxlength="500" autocomplete="off" placeholder="匿名说点什么…">
      <button class="send" type="submit">发送</button>
    </form>
  </section>

  <section class="files">
    <div class="files-head">
      <h2>共享文件</h2>
      <span id="count"></span>
    </div>
    <ul id="list"></ul>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var drop = document.getElementById('drop');
  var picker = document.getElementById('picker');
  var queueEl = document.getElementById('queue');
  var listEl = document.getElementById('list');
  var countEl = document.getElementById('count');
  var urlText = document.getElementById('urlText');
  var toastEl = document.getElementById('toast');

  var pending = [];
  var running = false;

  urlText.textContent = location.href;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    var u = ['KB', 'MB', 'GB', 'TB'];
    var i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return (n < 10 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i];
  }

  function fmtTime(ms) {
    var d = new Date(ms);
    var p = function (x) { return x < 10 ? '0' + x : x; };
    var sameDay = new Date().toDateString() === d.toDateString();
    var t = p(d.getHours()) + ':' + p(d.getMinutes());
    return sameDay ? t : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + t;
  }

  // ---------- 文件列表 ----------
  function loadFiles() {
    fetch('/api/files', { cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401) { location.replace('/login'); return {}; }
        return r.json();
      })
      .then(function (data) {
        render(data.files || [], data.total || 0);
      })
      .catch(function () {});
  }

  function render(files, total) {
    listEl.textContent = '';
    countEl.textContent = files.length
      ? files.length + ' 个 · ' + fmtSize(total)
      : '';

    if (!files.length) {
      var empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = '还没有文件，先上传一个试试';
      listEl.appendChild(empty);
      return;
    }

    files.forEach(function (f) {
      var li = document.createElement('li');
      li.className = 'f-item';

      var ico = document.createElement('div');
      ico.className = 'f-ico';
      ico.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';

      var main = document.createElement('div');
      main.className = 'f-main';
      var a = document.createElement('a');
      a.className = 'f-name';
      a.href = '/api/download?name=' + encodeURIComponent(f.name);
      a.textContent = f.name;
      a.title = f.name;
      var meta = document.createElement('div');
      meta.className = 'f-meta';
      meta.textContent = fmtSize(f.size) + ' · ' + fmtTime(f.mtime);
      main.appendChild(a);
      main.appendChild(meta);

      var acts = document.createElement('div');
      acts.className = 'f-actions';

      var dl = document.createElement('a');
      dl.className = 'icon-btn';
      dl.href = a.href;
      dl.title = '下载';
      dl.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0 5-5m-5 5-5-5"/><path d="M4 20h16"/></svg>';

      var del = document.createElement('button');
      del.className = 'icon-btn del';
      del.title = '删除';
      del.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>';
      del.addEventListener('click', function () {
        if (!confirm('删除「' + f.name + '」？')) return;
        fetch('/api/file?name=' + encodeURIComponent(f.name), { method: 'DELETE' })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (res.ok) { toast('已删除'); loadFiles(); }
            else toast(res.error || '删除失败');
          })
          .catch(function () { toast('删除失败'); });
      });

      acts.appendChild(dl);
      acts.appendChild(del);
      li.appendChild(ico);
      li.appendChild(main);
      li.appendChild(acts);
      listEl.appendChild(li);
    });
  }

  // ---------- 上传 ----------
  function enqueue(files) {
    Array.prototype.forEach.call(files, function (file) {
      var li = document.createElement('li');
      li.className = 'q-item';

      var meta = document.createElement('div');
      meta.className = 'q-meta';
      var nm = document.createElement('span');
      nm.className = 'q-name';
      nm.textContent = file.name;
      var st = document.createElement('span');
      st.className = 'q-status';
      st.textContent = '等待中';
      meta.appendChild(nm);
      meta.appendChild(st);

      var bar = document.createElement('div');
      bar.className = 'bar';
      var fill = document.createElement('i');
      bar.appendChild(fill);

      li.appendChild(meta);
      li.appendChild(bar);
      queueEl.appendChild(li);

      pending.push({ file: file, row: li, fill: fill, status: st });
    });
    pump();
  }

  function pump() {
    if (running) return;
    var task = pending.shift();
    if (!task) return;
    running = true;
    send(task).then(function () {
      running = false;
      pump();
      if (!pending.length) loadFiles();
    });
  }

  function send(task) {
    return new Promise(function (resolve) {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload?name=' + encodeURIComponent(task.file.name));
      task.status.textContent = '0%';

      xhr.upload.onprogress = function (e) {
        if (!e.lengthComputable) return;
        var pct = Math.round((e.loaded / e.total) * 100);
        task.fill.style.width = pct + '%';
        task.status.textContent = pct + '%';
      };

      xhr.onload = function () {
        var ok = false;
        try { ok = JSON.parse(xhr.responseText).ok; } catch (_) {}
        if (xhr.status === 200 && ok) {
          task.fill.style.width = '100%';
          task.status.textContent = '完成';
          task.row.classList.add('done');
        } else {
          task.status.textContent = '失败';
          task.row.classList.add('err');
          toast('上传失败：' + task.file.name);
        }
        setTimeout(function () {
          task.row.style.opacity = '0';
          task.row.style.transition = 'opacity .25s';
          setTimeout(function () {
            if (task.row.parentNode) task.row.parentNode.removeChild(task.row);
          }, 250);
        }, 900);
        resolve();
      };

      xhr.onerror = function () {
        task.status.textContent = '失败';
        task.row.classList.add('err');
        toast('网络中断：' + task.file.name);
        resolve();
      };

      xhr.send(task.file);
    });
  }

  // ---------- 交互 ----------
  drop.addEventListener('click', function () { picker.click(); });
  picker.addEventListener('change', function () {
    if (picker.files && picker.files.length) enqueue(picker.files);
    picker.value = '';
  });

  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) {
      e.preventDefault();
      drop.classList.add('over');
    });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) {
      e.preventDefault();
      drop.classList.remove('over');
    });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files.length) enqueue(e.dataTransfer.files);
  });

  document.getElementById('copyBtn').addEventListener('click', function () {
    var text = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('地址已复制'); }, function () { toast(text); });
    } else {
      toast(text);
    }
  });

  var qrLoaded = false;
  document.getElementById('qrBtn').addEventListener('click', function () {
    var box = document.getElementById('qrBox');
    if (!qrLoaded) {
      document.getElementById('qrImg').src = '/api/qr';
      qrLoaded = true;
    }
    box.classList.toggle('hidden');
  });

  // ---------- 匿名聊天 ----------
  var chatMsgs = document.getElementById('chatMsgs');
  var chatEmpty = document.getElementById('chatEmpty');
  var chatForm = document.getElementById('chatForm');
  var chatInput = document.getElementById('chatInput');
  var myNameEl = document.getElementById('myName');

  var myName = '';
  try { myName = localStorage.getItem('lt_nick') || ''; } catch (_) {}
  if (!myName) {
    myName = '匿名' + (1000 + Math.floor(Math.random() * 9000));
    try { localStorage.setItem('lt_nick', myName); } catch (_) {}
  }
  myNameEl.textContent = myName;

  var chatLastId = 0;

  function fmtClock(ms) {
    var d = new Date(ms);
    var p = function (x) { return x < 10 ? '0' + x : x; };
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function appendMessage(m) {
    if (chatEmpty && chatEmpty.parentNode) chatEmpty.parentNode.removeChild(chatEmpty);
    var mine = m.name === myName;
    var wrap = document.createElement('div');
    wrap.className = 'msg' + (mine ? ' me' : '');

    var who = document.createElement('div');
    who.className = 'who';
    who.textContent = (mine ? '我' : m.name) + ' · ' + fmtClock(m.ts);

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = m.text;

    wrap.appendChild(who);
    wrap.appendChild(bubble);
    chatMsgs.appendChild(wrap);

    while (chatMsgs.children.length > 320) {
      chatMsgs.removeChild(chatMsgs.firstChild);
    }
  }

  function pollChat() {
    fetch('/api/chat?since=' + chatLastId, { cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401) { location.replace('/login'); return {}; }
        return r.json();
      })
      .then(function (data) {
        if (!data || !data.ok || !data.messages || !data.messages.length) return;
        var firstLoad = chatLastId === 0;
        var nearBottom = chatMsgs.scrollHeight - chatMsgs.scrollTop - chatMsgs.clientHeight < 90;
        data.messages.forEach(function (m) {
          if (m.id <= chatLastId) return;
          chatLastId = m.id;
          appendMessage(m);
        });
        if (firstLoad || nearBottom) chatMsgs.scrollTop = chatMsgs.scrollHeight;
      })
      .catch(function () {});
  }

  chatForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = chatInput.value.trim();
    if (!text) return;
    chatInput.value = '';
    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: myName, text: text })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.ok) toast((res && res.error) || '发送失败');
        pollChat();
      })
      .catch(function () { toast('发送失败'); });
  });

  pollChat();
  setInterval(pollChat, 1500);

  loadFiles();
  setInterval(loadFiles, 5000);
})();
</script>
</body>
</html>
